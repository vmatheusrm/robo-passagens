name: Robo de Passagens

on:
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 minutos (horario UTC)
  workflow_dispatch: {}       # permite rodar na hora pelo botao "Run workflow"

permissions:
  contents: write             # para salvar data/estado.json

concurrency:
  group: robo-passagens
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o robo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
        run: python robo.py

      - name: Salvar estado
        run: |
          git config user.name "robo-passagens"
          git config user.email "robo-passagens@users.noreply.github.com"
          git add data/estado.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza estado do robo" -q
            git pull --rebase -q || true
            git push -q
          fi
